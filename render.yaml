services:
  - type: web
    name: apaar-verify
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DB_FILE
        value: /opt/render/project/src/data/data.db
      - key: JWT_SECRET
        generateValue: true
      - key: ID_ENC_KEY
        generateValue: true
      - key: ID_INDEX_KEY
        generateValue: true
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
